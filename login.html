<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Login to your LostFound Portal account to manage your lost and found item reports.">
<title>Login | Lost &amp; Found Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="login-card">
      <a href="index.html" class="card-logo">Lost<span>Found</span></a>
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to access your Lost &amp; Found account.</p>
      <form action="#" method="post">
        <div class="input-box">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="input-box">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <div class="options">
          <label class="remember"><input type="checkbox"> Remember Me</label>
          <a href="#" class="forgot-password">Forgot Password?</a>
        </div>
        <button type="submit" class="login-submit-btn">Login</button>
      </form>
      <div class="divider"><span>OR</span></div>
      <button class="google-btn">Continue with Google</button>
      <p class="signup-link">Don't have an account? <a href="signup.html">Create Account</a></p>
    </div>
  </div>
</body>
</html>
